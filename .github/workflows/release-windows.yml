name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      AGENT_HUB_URL: ${{ vars.AGENT_HUB_GATE_URL }}
      AGENT_HUB_TOKEN: ${{ secrets.AGENT_HUB_GATE_TOKEN }}
      AGENT_HUB_SHARED_BRANCHES: ${{ vars.AGENT_HUB_SHARED_BRANCHES }}
      AGENT_HUB_BRANCH: ${{ vars.AGENT_HUB_RELEASE_BRANCH || 'main' }}
      AGENT_HUB_ALLOW_UNGATED_RELEASE: ${{ vars.AGENT_HUB_ALLOW_UNGATED_RELEASE }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and package version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag ${{ github.ref_name }} must exactly match package version $expectedTag."
          }

      - name: Validate release notes are finalized
        shell: pwsh
        run: |
          $notesPath = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Required release notes were not found at $notesPath."
          }
          $releaseNotes = Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          $updateLog = Get-Content -LiteralPath UPDATE_LOG.txt -Raw -Encoding utf8
          $forbiddenMarkers = @(
            "当前为发布说明草稿",
            "未发布说明",
            "当前状态：开发候选",
            "待正式发布前填写",
            "待回填",
            "已确认，待实现",
            "（暂无）",
            "发布状态：本地候选，尚未发布",
            "尚未创建正式标签或 Release",
            "尚未打包",
            "未经明确指令"
          )
          foreach ($marker in $forbiddenMarkers) {
            if ($releaseNotes.Contains($marker) -or $updateLog.Contains($marker)) {
              throw "Release documentation is not finalized; found marker: $marker"
            }
          }
          $expectedTitle = "# Agent Hub ${{ github.ref_name }}"
          $firstLine = ($releaseNotes -split "\r?\n" | Select-Object -First 1).Trim()
          if ($firstLine -ne $expectedTitle) {
            throw "Release notes must start with the exact title: $expectedTitle"
          }
          $releaseNoteLines = @($releaseNotes -split "\r?\n" | ForEach-Object { $_.TrimEnd() })
          $requiredHeadings = @(
            "## 新增内容",
            "## 问题修复",
            "## 兼容性与升级",
            "## 已验证",
            "## 尚未完成的真实验收"
          )
          foreach ($heading in $requiredHeadings) {
            if ($releaseNoteLines -notcontains $heading) {
              throw "Release notes are missing required heading: $heading"
            }
          }
          if ($releaseNotes.Trim().Length -gt 8000) {
            throw "Release notes exceed the signed update manifest limit of 8000 characters."
          }

      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          $electronPath = Join-Path $PWD "node_modules/electron/dist/electron.exe"
          if (-not (Test-Path -LiteralPath $electronPath)) {
            throw "Electron runtime was not installed at $electronPath."
          }
          & $electronPath --version

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Agent Hub release gate configuration
        shell: pwsh
        run: |
          $hasUrl = -not [string]::IsNullOrWhiteSpace($env:AGENT_HUB_URL)
          $hasToken = -not [string]::IsNullOrWhiteSpace($env:AGENT_HUB_TOKEN)
          if ($hasUrl -xor $hasToken) {
            throw "Agent Hub publication gate requires both AGENT_HUB_GATE_URL and AGENT_HUB_GATE_TOKEN."
          }
          if (-not $hasUrl -and $env:AGENT_HUB_ALLOW_UNGATED_RELEASE -ne "true") {
            throw "Agent Hub publication gate is not configured. Set AGENT_HUB_ALLOW_UNGATED_RELEASE=true only for an explicitly audited ungated release."
          }

      - name: Agent Hub release gate
        if: env.AGENT_HUB_URL != '' && env.AGENT_HUB_TOKEN != ''
        run: pnpm gate:publish -- --branch "$env:AGENT_HUB_BRANCH"

      - name: Record explicit ungated release override
        if: env.AGENT_HUB_URL == '' && env.AGENT_HUB_TOKEN == '' && env.AGENT_HUB_ALLOW_UNGATED_RELEASE == 'true'
        run: Write-Warning "Publishing with the repository's explicit AGENT_HUB_ALLOW_UNGATED_RELEASE override."

      - name: Build signed-update-compatible NSIS package
        run: pnpm desktop:pack:ci

      - name: Verify packaged update recovery backup
        run: pnpm desktop:verify-recovery

      - name: Create signed update manifest
        shell: pwsh
        env:
          AGENT_HUB_UPDATE_SIGNING_KEY_B64: ${{ secrets.AGENT_HUB_UPDATE_SIGNING_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AGENT_HUB_UPDATE_SIGNING_KEY_B64)) {
            throw "Required GitHub secret AGENT_HUB_UPDATE_SIGNING_KEY_B64 is not configured."
          }
          $notesPath = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Required release notes were not found at $notesPath."
          }
          $env:AGENT_HUB_RELEASE_NOTES = (Get-Content -LiteralPath $notesPath -Raw -Encoding utf8).Trim()
          node scripts/create-update-manifest.mjs --release-dir release --tag "${{ github.ref_name }}"

      - name: Verify and checksum update assets
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -LiteralPath release -Filter "AgentHub-Setup-*.exe")
          $blockmap = @(Get-ChildItem -LiteralPath release -Filter "AgentHub-Setup-*.exe.blockmap")
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($setup.Count)." }
          if ($blockmap.Count -ne 1) { throw "Expected exactly one NSIS blockmap, found $($blockmap.Count)." }
          $required = @(
            (Get-Item -LiteralPath release/latest.yml),
            (Get-Item -LiteralPath release/agent-hub-update.json),
            (Get-Item -LiteralPath release/agent-hub-update.sig)
          )
          @($setup + $blockmap + $required) |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentHub-${{ github.ref_name }}-windows-x64
          path: |
            release/AgentHub-Setup-*.exe
            release/AgentHub-Setup-*.exe.blockmap
            release/latest.yml
            release/agent-hub-update.json
            release/agent-hub-update.sig
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft GitHub Release and upload update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = "docs/releases/${{ github.ref_name }}.md"
          $draft = gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne "true") {
              throw "Refusing to replace assets on an already published stable release."
            }
          } else {
            gh release create "${{ github.ref_name }}" --draft --verify-tag --notes-file $notesPath --title "Agent Hub ${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $releaseFiles = @(
            (Resolve-Path release/AgentHub-Setup-*.exe).Path
            (Resolve-Path release/AgentHub-Setup-*.exe.blockmap).Path
            (Resolve-Path release/latest.yml).Path
            (Resolve-Path release/agent-hub-update.json).Path
            (Resolve-Path release/agent-hub-update.sig).Path
            (Resolve-Path release/SHA256SUMS.txt).Path
          )
          gh release upload "${{ github.ref_name }}" @releaseFiles --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "${{ github.ref_name }}" --title "Agent Hub ${{ github.ref_name }}" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Draft release is ready for asset and release-note verification before publication."
